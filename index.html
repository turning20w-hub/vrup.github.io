<!DOCTYPE html>
<html lang="en"> 

  <head>
    <title>Wander Console - Discover the Small Web</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* Colours */
      body { background: #696 }
      body, button, input { color: #030 }
      button, input, dialog { background: #bdb; border-color: #363 }
      button:hover { background: #9c9 }
      button:active { background: #8c8 }
      button:disabled, button:disabled:hover, button:disabled:active { background: #cec }
      dialog { background: #cec }
      dialog::backdrop { background: #0009 }
      dialog details[open] { background: #bdb }

      /* Body and header */
      body {
        line-height: 1.5;
        margin: 0;
        overflow-wrap: break-word;
      }
      body, button, input {
        font-family: courier, monospace;
        font-size: medium;
        font-weight: bold;
      }
      button, input {
        min-height: 2.5em;
        box-sizing: border-box;
      }
      button { cursor: pointer }
      button:disabled {
        border: thick double;
        cursor: default
      }
      input { padding-left: 0.5em }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        padding: 0.5em;
      }
      header button { flex: 1 1 0% }
      header input { flex: 0 0 100% }
      #go-button, #open-button { display: none }
      noscript {
        border: medium double #600;
        color: #600;
        display: block;
        font-size: x-large;
        margin-bottom: 1em;
        padding: 1em;
        text-align: center;
      }
      .center {
        text-align: center;
      }
      /* Dialog */
      dialog {
        border: thick solid;
        box-sizing: border-box;
        margin: 1em auto;
        max-height: calc(100vh - 2em);
        width: min(45em, calc(100% - 2em));
        overflow: auto;
      }
      dialog header { padding: 0 }
      dialog header span, dialog header form { flex: 1 1 0% }
      dialog header button {
        box-sizing: border-box;
        height: 2em;
        min-height: 0;
        padding: 0;
        width: 2em;
      }
      dialog header h1 {
        flex: 0 1 auto;
        margin: 0;
        text-align: center;
      }
      dialog header form {
        text-align: right;
      }
      dialog h2 {
        font-size: 1.2em;
        margin: 1.5em 0 0 0;
      }
      dialog h2 + p {
        margin-top: 0.5em;
      }
      dialog nav button {
        display: block;
        margin: 1em auto;
        width: min(30em, calc(100% - 2em));
      }
      dialog header + div {
        text-align: center;
      }
      dialog details summary {
        padding-left: 2em;
        text-indent: -1em;
      }
      dialog details p {
        padding-left: 2em;
      }
      dialog details ul {
        padding-left: 4em;
      }
      dialog footer button {
        width: 6em;
        display: block;
        margin: 1.5em auto 0.5em auto;
      }
      svg {
        color: inherit;
        height: 0.8em;
        width: 0.8em;
        margin-left: 0.25em;
        vertical-align: middle;
      }
      /* Frames */
      #wander-iframe {
        background: #fff;
        border: thick solid #363;
        box-sizing: border-box;
        height: calc(100vh - 6.5em);
        width: 100%;
      }
      .loader-iframe-template {
        display: none;
      }
      /* Wide screen */
      @media (min-width: 40em) {
        body { padding: 1em }
        header { padding: 0 0 1em 0 }
        header input { order: 1; flex: 3 1 0% }
        #go-button, #open-button, #about-button { order: 2; display: block }
        #wander-iframe { height: calc(100vh - 5.5em) }
      }
    </style>
    <script src="wander.js"></script>
    <script>
      const VERSION = '0.6.0'
      const LOGGING = true
      const HISTORY_SIZE = 100
      const IDLE_MODE = 0
      const WANDERING_MODE = 1
      const WANDER_MODE = 2
      const CRAWL_MODE = 3
      const MAX_CRAWL_CONSOLES = 10000

      const pages = []
      const ignores = []
      const consoles = []
      const visitedPages = []
      const crawlConsoleQueue = []
      const crawlConsoleMap = {}
      const crawlPageMap = {}

      let mode = IDLE_MODE
      let consolesFound = 0
      let pagesPicked = 0
      let crawlTimer = null
      let crawlConsoleCounter
      let crawlPageCounter

      // Main Console
      // ------------

      function init () {
        log(`Wander ${VERSION}`)
        initCustomStyle()
        initCustomScript()
        initListeners()
        initConsoleDialog()
        initVersion()
        initIgnores(wander.ignore || [])

        const baseURL = normaliseWanderURL(window.location.href)
        saveWanderConsoles(baseURL, [baseURL].concat(wander.consoles || []))
        saveWanderPages(baseURL, wander.pages || [])
        pickPage()
        log('Initialised')
      }

      function initCustomStyle () {
        const styles = wander.styles || []
        for (const href of styles) {
          const link = document.createElement('link')
          link.rel = 'stylesheet'
          link.href = href
          document.head.append(link)
        }
      }

      function initCustomScript () {
        const scripts = wander.scripts || []
        for (const src of scripts) {
          const script = document.createElement('script')
          script.src = src
          document.head.append(script)
        }
      }

      function initListeners () {
        document.getElementById('about-button').addEventListener('click', showAboutDialog)
        document.getElementById('console-button').addEventListener('click', showConsoleDialog)
        document.getElementById('open-button').addEventListener('click', openURL)
        document.getElementById('go-button').addEventListener('click', gotoURL)
        document.getElementById('url-input').addEventListener('keydown', handleURLInput)
        document.getElementById('wander-button').addEventListener('click', pickPage)
        document.getElementById('wander-iframe').addEventListener('load', pageLoadDone)
        document.getElementById('wander-iframe').addEventListener('error', pageLoadError)
        window.addEventListener('message', receiveMessage)
      }

      function initConsoleDialog () {
        const dialog = document.getElementById('console-dialog')
        const menu = document.getElementById('menu-section')
        const back = document.getElementById('back-button')
        for (const button of menu.querySelectorAll('button')) {
          const key = button.id.replace('-button', '')
          button.addEventListener('click', function (e) {
            changeConsoleDialogSection(key)
          })
        }
        dialog.addEventListener('close', function () {
          log('Dialog box closed')
          clearTimeout(crawlTimer)
        })
        back.addEventListener('click', function () {
          changeConsoleDialogSection('menu')
        })
      }

      function showConsoleDialog () {
        setupConsoleDialogBase()
        setupConsoleDialogNeighbours()
        setupConsoleDialogPages()
        setupConsoleDialogIgnores()
        setupConsoleDialogHistory()
        setupConsoleDialogDiscovery()
        changeConsoleDialogSection('menu')
        document.getElementById('console-dialog').showModal()
      }

      function changeConsoleDialogSection (key) {
        const dialog = document.getElementById('console-dialog')
        const back = document.getElementById('back-button')
        log(`Changing console dialog to section: ${key}`)
        clearTimeout(crawlTimer)
        back.style.visibility = key === 'menu' ? 'hidden' : 'visible'
        for (const section of dialog.querySelectorAll('section')) {
          section.style.display = 'none'
        }
        document.getElementById(key + '-section').style.display = 'block'
        if (key === 'crawl') {
          startCrawl()
        }
      }

      function initVersion () {
        for (const element of document.querySelectorAll('.version')) {
          element.textContent = VERSION
        }
      }

      function initIgnores (patterns) {
        for (const pattern of patterns) {
          ignores.push(pattern)
        }
      }

      // Wandering
      // ---------

      function saveWanderConsoles (referrerURL, consoleURLs) {
        const prevConsolesFound = consolesFound
        for (const url of consoleURLs) {
          if (!URL.canParse(url)) {
            log(`Skipped bad console URL: ${referrerURL} => ${url}`)
            continue
          }
          const normURL = normaliseWanderURL(url)
          if (isFileURL(normURL)) {
            log(`Skipped file URL: ${referrerURL} => ${normURL}`)
            continue
          }
          if (!isCompatibleURL(normURL)) {
            log(`Skipped incompatible console URL: ${referrerURL} => ${normURL}`)
            continue
          }
          if (isDuplicateURL(consoles, normURL)) {
            log(`Skipped duplicate console URL: ${referrerURL} => ${normURL}`)
            continue
          }
          if (isIgnoredURL(ignores, normURL)) {
            log(`Skipped ignored console URL: ${referrerURL} => ${normURL}`)
            continue
          }
          consoles.push({ referrer: referrerURL, url: normURL })
          consolesFound++
          log(`Discovered console URL: ${referrerURL} => ${normURL} ` +
              `(total ${consolesFound}, saved ${consoles.length})`)
        }
        if (consolesFound === prevConsolesFound) {
          log(`No new consoles found at ${wanderJSURL(referrerURL)}`)
          return
        }
        trimHistory(consoles)
        log('Trimmed console history ' +
            `(total ${consolesFound}, saved ${consoles.length})`)
      }

      function saveWanderPages (referrerURL, pageURLs) {
        const goodPages = []
        for (const url of pageURLs) {
          if (!URL.canParse(url)) {
            log(`Skipped bad page URL: ${referrerURL} => ${url}`)
            continue
          }
          if (!isCompatibleURL(url)) {
            log(`Skipped incompatible page URL: ${referrerURL} => ${url}`)
            continue
          }
          if (isDuplicateURL(visitedPages, url)) {
            log(`Skipped recently visited page URL: ${referrerURL} => ${url}`)
            continue
          }
          if (isIgnoredURL(ignores, url)) {
            log(`Skipped ignored page URL: ${referrerURL} => ${url}`)
            continue
          }
          goodPages.push({ referrer: referrerURL, url })
          log(`Discovered page URL: ${referrerURL} => ${url} (saved ${goodPages.length})`)
        }
        if (goodPages.length === 0) {
          log(`WARNING: No good pages found at ${wanderJSURL(referrerURL)}`)
          return
        }
        if (goodPages.length > 0) {
          pages.length = 0
          goodPages.forEach(function (item) { pages.push(item) })
        }
      }

      function pickPage () {
        if (pages.length === 0) {
          log('WARNING: No valid pages available')
          return
        }
        const iframe = document.getElementById('wander-iframe')
        const page = pick(pages)
        log('----- BEGIN WANDERING -----')
        mode = WANDERING_MODE
        document.getElementById('url-input').value = page.url
        log(`Loading page: ${page.referrer} => ${page.url}`)
        iframe.src = page.url
        visitedPages.push(page)
        pagesPicked++
        trimHistory(visitedPages)
        log('Trimmed page history ' +
            `(total ${pagesPicked}, saved ${visitedPages.length})`)
      }

      function pageLoadDone () {
        const iframe = document.getElementById('wander-iframe')
        log('Loaded page')
        if (iframe.style.display !== 'block') {
          iframe.style.display = 'block'
          log('Displayed iframe')
        }
        iframe.focus()
        if (mode === WANDERING_MODE) {
          log('----- END WANDERING -----')
          mode = IDLE_MODE
          pickConsole()
        }
      }

      function pageLoadError (e) {
        log('ERROR:', e)
        if (mode === WANDERING_MODE) {
          log('----- FAILED WANDERING -----')
        }
      }

      function pickConsole () {
        if (consoles.length === 0) {
          log('WARNING: No valid consoles found')
          return
        }
        const console = pick(consoles)
        log('Loading next console:', console.url)
        loadWanderJS(console.url, WANDER_MODE)
      }

      // Crawler
      // -------

      function saveCrawlConsoles (referrerURL, consoleURLs) {
        for (const url of consoleURLs) {
          if (!URL.canParse(url)) {
            log(`Skipped bad console URL: ${referrerURL} => ${url}`)
            continue
          }
          const normURL = normaliseWanderURL(url)
          if (isIgnoredURL(ignores, normURL)) {
            log(`Skipped ignored console URL: ${referrerURL} => ${normURL}`)
            continue
          }
          if (!crawlConsoleMap[normURL]) {
            // Save new referenced consoles in the map.
            crawlConsoleQueue.push(normURL)
            crawlConsoleMap[normURL] = {
              depth: crawlConsoleMap[referrerURL].depth + 1,
              referrers: [],
              visited: false
            }
          }
          // The console being crawled is a referrer for other consoles.
          const value = crawlConsoleMap[normURL]
          value.referrers.push(referrerURL)
        }
      }

      function saveCrawlPages (referrerURL, pageURLs) {
        for (const url of pageURLs) {
          if (!URL.canParse(url)) {
            log(`Skipped bad page URL: ${referrerURL} => ${url}`)
            continue
          }
          if (isIgnoredURL(ignores, url)) {
            log(`Skipped ignored page URL: ${referrerURL} => ${url}`)
            continue
          }
          if (!crawlPageMap[url]) {
            crawlPageMap[url] = {
              depth: crawlConsoleMap[referrerURL].depth,
              id: 'crawl-page-' + crawlPageCounter++,
              referrers: []
            }
          }
          const value = crawlPageMap[url]
          value.referrers.push(referrerURL)
        }
      }

      function startCrawl () {
        // Reset data.
        Object.keys(crawlConsoleMap).forEach(function (key) {
          delete crawlConsoleMap[key]
        })
        Object.keys(crawlPageMap).forEach(function (key) {
          delete crawlPageMap[key]
        })
        crawlConsoleQueue.length = 0
        crawlConsoleCounter = 0
        crawlPageCounter = 0
        cdj()
        // Reset dialog.
        document.getElementById('crawl-console-info').textContent = 'Crawling ...'
        document.getElementById('crawl-console-list').textContent = ''
        document.getElementById('crawl-page-info').textContent = ''
        document.getElementById('crawl-page-list').textContent = ''
        // Start crawl.
        clearTimeout(crawlTimer)
        const baseURL = normaliseWanderURL(window.location.href)
        crawlConsoleMap[baseURL] = {
          depth: 0,
          id: 'crawl-console-' + ++crawlConsoleCounter,
          referrers: [],
          visited: true
        }
        saveCrawlConsoles(baseURL, wander.consoles || [], wander.pages || [])
        log('Starting crawl')
        crawl()
      }

      function crawl () {
        updateCrawlSection('console', crawlConsoleMap)
        updateCrawlSection('page', crawlPageMap)
        if (crawlConsoleCounter >= MAX_CRAWL_CONSOLES) {
          log(`Cancelling crawl; max ${crawlConsoleCounter} consoles crawled`)
          return
        }
        log(`Crawling ${crawlConsoleQueue.length} consoles`)
        const interval = 100
        const extraDelay = crawlConsoleQueue.length === 0 ? 2000 : 0
        let delay = interval
        while (crawlConsoleQueue.length > 0) {
          const consoleURL = crawlConsoleQueue.shift()
          setTimeout(function () {
            loadWanderJS(consoleURL, CRAWL_MODE)
          }, delay)
          delay += interval
        }
        crawlTimer = setTimeout(crawl, delay + extraDelay)
      }

      function updateCrawlSection (type, crawlMap) {
        const info = document.getElementById(`crawl-${type}-info`)
        const list = document.getElementById(`crawl-${type}-list`)
        let count = 0
        for (const url in crawlMap) {
          const value = crawlMap[url]
          if (type === 'console' && value.visited === false) {
            continue
          }
          let details = document.getElementById(value.id)
          if (!details) {
            details = document.createElement('details')
            const summary = document.createElement('summary')
            const p = document.createElement('p')
            const ul = document.createElement('ul')
            details.append(summary, p, ul)
            summary.append(type === 'console' ? createConsoleLink(url) : createExtLink(url))
            list.append(details)
            details.id = value.id
            p.className = 'info'
          }
          const p = details.querySelector('.info')
          const label = countWord(value.referrers.length, 'console')
          const ul = details.querySelector('ul')
          p.textContent = `Found ${label} linking to this ${type}:`
          ul.textContent = ''
          for (const referrerURL of value.referrers) {
            const li = document.createElement('li')
            ul.append(li)
            li.append(createConsoleLink(referrerURL))
          }
          count++
        }
        const label = countWord(count, type)
        info.textContent = `Found ${label}:`
      }

      function cdj () {
        const data = {
          date: formatTime(),
          consoles: crawlConsoleMap,
          pages: crawlPageMap
        }
        log(JSON.stringify(data, null, 2))
      }

      // Loader
      // ------

      function loadWanderJS (wanderURL, mode) {
        const iframe = document.querySelector('.loader-iframe-template').cloneNode()
        const jsURL = wanderJSURL(wanderURL)
        const urlAsCode = JSON.stringify(wanderURL)
        log('Loading console JS URL:', jsURL)
        iframe.srcdoc = `
          <script src="${jsURL}"></scr` + `ipt>
          <script>
            parent.postMessage({ type: ${mode}, wander: wander, url: ${urlAsCode} }, '*')
          </scr` + 'ipt>'
        document.body.append(iframe)
        setTimeout(function () { iframe.remove() }, 10000)
      }

      function receiveMessage (e) {
        log(`Received message; origin: ${e.origin}; data: ${e.data}; event:`, e)
        if (e.origin !== 'null') {
          log('WARNING: Ignored message from untrusted origin:', e.origin)
          return
        }
        if (typeof e.data !== 'object' || e.data === null ||
            typeof e.data.url !== 'string' ||
            typeof e.data.wander !== 'object' || e.data.wander === null) {
          log('WARNING: Ignored dodgy message:', e.data)
          return
        }
        if (!isArrayOfStrings(e.data.wander.consoles) ||
            !isArrayOfStrings(e.data.wander.pages)) {
          log('WARNING: Ignored bad console data:', e.data)
          return
        }
        if (e.data.type === WANDER_MODE) { // Wander mode.
          log('Loaded next console:', e.data.url)
          saveWanderConsoles(e.data.url, e.data.wander.consoles || [])
          saveWanderPages(e.data.url, e.data.wander.pages || [])
        } else { // Crawl mode.
          if (crawlConsoleCounter >= MAX_CRAWL_CONSOLES) {
            log(`Ignoring crawl data from ${e.data.url}; ` +
                `max ${crawlConsoleCounter} consoles saved`)
            return
          }
          crawlConsoleMap[e.data.url].visited = true
          crawlConsoleMap[e.data.url].id = 'crawl-console-' + ++crawlConsoleCounter
          saveCrawlConsoles(e.data.url, e.data.wander.consoles || [])
